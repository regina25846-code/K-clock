<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>K-Clock</title>
<style>
@font-face { font-family:'KoPubWorld Dotum Light'; src:url('fonts/KoPubWorld Dotum Light.ttf'); }
@font-face { font-family:'KoPubWorld Dotum Medium'; src:url('fonts/KoPubWorld Dotum Medium.ttf'); }
@font-face { font-family:'KoPubWorld Dotum Bold'; src:url('fonts/KoPubWorld Dotum Bold.ttf'); }

* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
body { background:transparent; font-family:'Segoe UI',sans-serif; overflow:hidden; }

#clock-area { width:100%; display:flex; flex-direction:column; align-items:center; cursor:grab; background:transparent; }
#clock-area.dragging { cursor:grabbing; }
/* align-items:flex-start — center로 두면 7세그먼트 확대 시 예약해둔 min-height 안에서
   내용물이 세로로 다시 가운데 정렬되면서 transform-origin:'center top' 가정이 깨져
   패널과 겹치는 폭이 더 커짐(2026-08-02, min-height 보정 추가하며 발견). */
#clock-row { display:flex; align-items:flex-start; justify-content:center; width:100%; }

/* 7세그먼트 */
.clock-7seg { display:flex; align-items:center; }
.digit-group { display:flex; gap:3px; }
.seg-digit { position:relative; width:22px; height:40px; }
.seg { position:absolute; background:#b8b8b8; border-radius:1px; transition:opacity 0.05s; }
.seg.off { opacity:0; }
.seg-h{width:16px;height:3px;left:3px} .seg-v{width:3px;height:14px}
.seg-a{top:0} .seg-b{top:3px;right:0} .seg-c{bottom:3px;right:0}
.seg-d{bottom:0} .seg-e{bottom:3px;left:0} .seg-f{top:3px;left:0} .seg-g{top:18px}
.colon7{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 5px 3px}
.dot{width:4px;height:4px;border-radius:50%;background:#b8b8b8}

#text-clock { font-size:52px; color:#b8b8b8; letter-spacing:2px; font-weight:300; line-height:1; display:none; white-space:nowrap; }

/* 패널 */
.panel { width:300px; background:rgba(0,0,0,0.5); border-radius:0 0 10px 10px; padding:10px 14px; position:relative; display:none; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.panel.open { display:block; }
.panel-title { font-size:14px; color:rgba(184,184,184,0.9); font-weight:600; margin-bottom:10px; }
.close-panel { position:absolute; top:8px; right:10px; color:rgba(184,184,184,0.5); font-size:13px; background:none; border:none; cursor:pointer; }

/* ── 업데이트 안내 카드 (5개 앱 공용 컴포넌트, K-Clock은 기존 .panel 재사용) ── */
.upd-card {
  --upd-accent : #c9a35c;
  --upd-fg     : #b8b8b8;
  --upd-dim    : #777;
  --upd-line   : rgba(255,255,255,0.08);
  --upd-ctl-bg : rgba(255,255,255,0.08);
  --upd-ctl-br : rgba(255,255,255,0.15);
  display:block;
}
.upd-head { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.upd-badge { flex-shrink:0; font-size:10px; line-height:1.2; padding:1px 5px;
             border:1px solid var(--upd-accent); border-radius:4px; color:var(--upd-accent);
             font-family:'Consolas',monospace; }
.upd-headline { min-width:0; font-size:12px; color:rgba(184,184,184,0.9);
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.upd-body { max-height:180px; overflow-y:auto; overflow-x:hidden; }
.upd-body::-webkit-scrollbar { width:5px; }
.upd-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }
.upd-body::-webkit-scrollbar-track { background:transparent; }
.upd-ver { padding:6px 0; border-bottom:1px solid var(--upd-line); }
.upd-ver:first-child { padding-top:0; }
.upd-ver:last-child { border-bottom:none; padding-bottom:0; }
.upd-ver-head { display:flex; align-items:baseline; gap:5px; margin-bottom:4px; }
.upd-ver-num { font-size:11px; color:var(--upd-fg); font-family:'Consolas',monospace; }
.upd-ver-date { font-size:10px; color:var(--upd-dim); }
.upd-list { list-style:none; display:flex; flex-direction:column; gap:3px; }
.upd-item { position:relative; padding-left:9px; font-size:11px; line-height:1.5;
            color:var(--upd-fg); word-break:keep-all; }
.upd-item::before { content:''; position:absolute; left:2px; top:7px; width:3px; height:3px;
                    border-radius:50%; background:rgba(184,184,184,0.35); }
.upd-foot { display:flex; align-items:center; justify-content:space-between; gap:6px;
            margin-top:8px; padding-top:8px; border-top:1px solid var(--upd-line); }
.upd-more { font-size:10px; color:var(--upd-dim); text-decoration:none; cursor:pointer; }
.upd-more:hover { color:var(--upd-fg); text-decoration:underline; }
.upd-ok { flex-shrink:0; padding:4px 14px; background:var(--upd-ctl-bg); color:var(--upd-fg);
          border:1px solid var(--upd-ctl-br); border-radius:5px; font-size:11px;
          cursor:pointer; font-family:inherit; }
.upd-ok:hover { background:rgba(255,255,255,0.14); }
@keyframes updIn { from { opacity:0 } to { opacity:1 } }
.upd-card { animation:updIn 0.18s ease-out; }
@media (prefers-reduced-motion: reduce) { .upd-card { animation:none } }

/* 알람 */
.alarm-sound-row { margin-bottom:8px; }
.alarm-sound-row select { width:100%; }
.alarm-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.alarm-row input[type=time] { width:100px; flex-shrink:0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:5px; color:#b8b8b8; padding:4px 6px; font-size:12px; outline:none; font-family:inherit; }
.alarm-row input[type=text] { flex:1; min-width:0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:5px; color:#b8b8b8; padding:4px 6px; font-size:12px; outline:none; font-family:inherit; }
.btn-add { flex-shrink:0; width:36px; padding:5px 0; background:rgba(255,255,255,0.10); color:#b8b8b8; border:1px solid rgba(255,255,255,0.15); border-radius:5px; font-size:11px; cursor:pointer; text-align:center; }
.btn-repeat { flex-shrink:0; width:26px; height:26px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); border-radius:5px; cursor:pointer; color:rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; padding:0; }
.btn-repeat.active { color:#4a9; border-color:#4a9; }
.alarm-repeat-icon { color:#4a9; display:inline-flex; align-items:center; margin-left:3px; vertical-align:middle; }
.alarm-list { display:flex; flex-direction:column; gap:4px; max-height:180px; overflow-y:auto; overflow-x:hidden; }
.alarm-list::-webkit-scrollbar { width:5px; }
.alarm-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }
.alarm-list::-webkit-scrollbar-track { background:transparent; }
.alarm-item { display:flex; align-items:center; justify-content:space-between; padding:5px 2px; font-size:12px; color:#b8b8b8; border-bottom:1px solid rgba(255,255,255,0.08); gap:6px; cursor:grab; }
.alarm-item.dragging { position:relative; z-index:5; cursor:grabbing; background:rgba(255,255,255,0.06); border-radius:5px; box-shadow:0 2px 8px rgba(0,0,0,0.4); }
.alarm-item .alarm-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
.alarm-item input[type=time] { width:100px; flex-shrink:0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:5px; color:#b8b8b8; padding:3px 4px; font-size:11px; outline:none; font-family:inherit; }
.alarm-item input[type=text] { flex:1; min-width:0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:5px; color:#b8b8b8; padding:3px 4px; font-size:11px; outline:none; font-family:inherit; }
.alarm-edit-btn { flex-shrink:0; width:20px; height:20px; padding:0; background:rgba(255,255,255,0.10); color:#b8b8b8; border:1px solid rgba(255,255,255,0.15); border-radius:5px; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.alarm-edit-btn.active { color:#4a9; border-color:#4a9; }
.alarm-toggle { width:26px; height:14px; background:#333; border-radius:7px; position:relative; cursor:pointer; flex-shrink:0; }
.alarm-toggle::after { content:''; position:absolute; width:10px; height:10px; background:#fff; border-radius:50%; top:2px; left:2px; transition:left 0.15s; }
.alarm-toggle.on { background:#4a9; }
.alarm-toggle.on::after { left:14px; }
.alarm-del { background:none; border:none; color:rgba(255,80,80,0.6); cursor:pointer; font-size:12px; padding:0 2px; flex-shrink:0; }
.empty-msg { font-size:11px; color:#777; padding:4px 0; }

/* 카운트다운 */
.cd-row { display:flex; align-items:center; gap:4px; margin-bottom:8px; justify-content:center; }
.cd-row input[type=number] { width:44px; text-align:center; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:5px; color:#b8b8b8; padding:4px; font-size:12px; outline:none; }
.cd-row span { color:#555; }
#cd-display { font-size:22px; color:#b8b8b8; text-align:center; margin:8px 0; letter-spacing:2px; font-family:'Consolas',monospace; font-weight:300; }
.cd-btns { display:flex; gap:5px; justify-content:center; }
.cd-btns button { padding:4px 10px; border:1px solid rgba(255,255,255,0.15); border-radius:5px; font-size:11px; cursor:pointer; white-space:nowrap; background:rgba(255,255,255,0.08); color:#b8b8b8; }

/* 카운트다운 프리셋 */
.cd-save-btn { flex-shrink:0; width:36px; padding:5px 0; margin-left:2px; background:rgba(255,255,255,0.10); color:#b8b8b8; border:1px solid rgba(255,255,255,0.15); border-radius:5px; font-size:11px; cursor:pointer; text-align:center; }
.cd-save-btn.picking { color:#c9a35c; border-color:#c9a35c; }
.cd-save-btn:disabled { opacity:0.35; cursor:default; }
.cd-preset-sec { margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.08); }
.cd-preset-sec.disabled { opacity:0.4; pointer-events:none; }
.cd-preset-row { display:flex; gap:5px; }
.cd-preset { flex:1; min-width:0; height:38px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0 2px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:5px; color:#b8b8b8; cursor:pointer; overflow:hidden; }
.cd-preset:hover { background:rgba(255,255,255,0.14); }
.cd-preset .p-time { font-size:12px; font-family:'Consolas',monospace; line-height:1.1; max-width:100%; overflow:hidden; white-space:nowrap; }
.cd-preset .p-name { font-size:10px; color:rgba(184,184,184,0.6); line-height:1.1; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cd-preset.empty { background:rgba(255,255,255,0.03); border:1px dashed rgba(255,255,255,0.15); color:rgba(255,255,255,0.25); font-size:14px; cursor:pointer; }
.cd-preset.empty:hover { background:rgba(255,255,255,0.07); }
.cd-preset.pick { border-color:#c9a35c; color:#c9a35c; }
.cd-preset.pick .p-name { color:#c9a35c; }
.cd-preset-del { position:absolute; top:0; right:1px; background:none; border:none; color:rgba(255,80,80,0.6); font-size:10px; line-height:1; cursor:pointer; padding:1px 2px; opacity:0; }
.cd-preset:hover .cd-preset-del { opacity:1; }
.cd-preset input[type=text] { width:100%; min-width:0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:4px; color:#b8b8b8; padding:2px 3px; font-size:10px; text-align:center; outline:none; font-family:inherit; }
.cd-hint { font-size:11px; color:#b8b8b8; text-align:center; margin-top:6px; height:13px; line-height:13px; }
.cd-hint.picking { color:#c9a35c; }

/* ── 프리셋 드래그 재정렬 (알람 목록 드래그와 동일 계열) ── */
.cd-preset.dragging { z-index:5; cursor:grabbing; background:rgba(255,255,255,0.14); box-shadow:0 2px 8px rgba(0,0,0,0.4); }

/* ── 프리셋 시간/이름 수정 (연필 = 삭제✕의 거울상) ── */
.cd-preset-edit { position:absolute; top:0; left:1px; background:none; border:none; color:rgba(184,184,184,0.5); font-size:10px; line-height:1; cursor:pointer; padding:1px 2px; opacity:0; display:flex; align-items:center; }
.cd-preset:hover .cd-preset-edit { opacity:1; }
.cd-preset.editing { border-color:#c9a35c; color:#c9a35c; }
.cd-preset.editing .p-name { color:#c9a35c; }
.cd-save-btn.editing { color:#c9a35c; border-color:#c9a35c; }

/* 설정 */
.setting-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.08); font-size:12px; color:#b8b8b8; }
.setting-row:last-child { border-bottom:none; }
.toggle { width:30px; height:16px; background:#4a9; border-radius:8px; position:relative; cursor:pointer; flex-shrink:0; }
.toggle::after { content:''; position:absolute; width:12px; height:12px; background:#fff; border-radius:50%; top:2px; left:16px; transition:left 0.15s; }
.toggle.off::after { left:2px; }
.toggle.off { background:#333; }
select { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:5px; color:#b8b8b8; padding:3px 6px; font-size:11px; outline:none; cursor:pointer; }
select option { background:#1e1e1e; color:#b8b8b8; }
/* 네이티브 select의 옵션 목록은 OS 별도 팝업 창으로 뜨는데, 시계 창이 항상위(topmost)라
   그 팝업이 시계 창 뒤로 깔려서 선택 자체가 안 되는 문제가 있었음(2026-08-02, 항상위를
   진짜로 고치고 나서 드러남) — select를 순수 DOM 기반 커스텀 드롭다운으로 교체해서
   같은 창 안에서만 겹치게 함. */
.cdd { position:relative; flex-shrink:0; }
.alarm-sound-row .cdd { width:100%; }
.cdd-btn { text-align:left; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:5px; color:#b8b8b8; padding:3px 6px; font-size:11px; outline:none; cursor:pointer; font-family:inherit; white-space:nowrap; }
.alarm-sound-row .cdd-btn { width:100%; }
.cdd-list { display:none; position:absolute; top:100%; right:0; margin-top:2px; background:#1e1e1e; border:1px solid rgba(255,255,255,0.15); border-radius:5px; min-width:100%; max-height:160px; overflow-y:auto; overflow-x:hidden; z-index:50; white-space:nowrap; }
.alarm-sound-row .cdd-list { left:0; right:0; white-space:normal; }
.cdd-list.open { display:block; }
.cdd-item { padding:5px 8px; font-size:11px; color:#b8b8b8; cursor:pointer; }
.cdd-item:hover { background:rgba(255,255,255,0.1); }
.cdd-divider { padding:4px 8px 2px; font-size:9px; color:#777; border-top:1px solid rgba(255,255,255,0.1); margin-top:2px; }
/* 윈도우 기본(각진 화살표 버튼) 스크롤바가 다크 플랫 디자인과 안 어울려서(2026-08-02, 형 지적)
   슬림한 커스텀 스크롤바로 교체. WebView2는 크로미움 기반이라 webkit 스크롤바 CSS가 그대로 먹음. */
.cdd-list::-webkit-scrollbar { width:6px; }
.cdd-list::-webkit-scrollbar-track { background:transparent; }
.cdd-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.25); border-radius:3px; }
.cdd-list::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.4); }
.color-btn { padding:3px 9px; border:1px solid rgba(255,255,255,0.18); border-radius:4px; font-size:11px; cursor:pointer; background:transparent; color:#b8b8b8; }
.color-btn.active { border-color:#aaa; background:rgba(255,255,255,0.15); }

/* 우클릭 메뉴 */
#ctx-menu { position:fixed; background:rgba(22,22,22,0.97); border:1px solid rgba(255,255,255,0.09); border-radius:9px; padding:5px 0; min-width:130px; box-shadow:0 6px 20px rgba(0,0,0,0.7); display:none; z-index:1000; }
.menu-item { padding:7px 14px; font-size:14px; color:rgba(255,255,255,0.7); cursor:pointer; display:flex; align-items:center; gap:8px; }
.menu-item svg { flex-shrink:0; opacity:0.75; }
.menu-item:hover { background:rgba(255,255,255,0.07); }
.menu-sep { height:1px; background:rgba(255,255,255,0.07); margin:3px 0; }
.menu-item.danger { color:rgba(255,90,90,1); }

@keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.15} }
.flashing { animation:flash 0.5s ease-in-out infinite; }
</style>
</head>
<body>

<div id="clock-area">
  <div id="clock-row">
    <div class="clock-7seg" id="seg-wrap">
      <div class="digit-group" id="dh"></div>
      <div class="colon7" id="colon1"><div class="dot"></div><div class="dot"></div></div>
      <div class="digit-group" id="dm"></div>
      <div class="colon7" id="colon2"><div class="dot"></div><div class="dot"></div></div>
      <div class="digit-group" id="ds"></div>
    </div>
    <div id="text-clock">00:00:00</div>
  </div>

  <div class="panel" id="panel-alarm">
    <div class="panel-title">알람</div>
    <button class="close-panel" onclick="closePanel()">✕</button>
    <div class="alarm-sound-row">
      <div class="cdd" id="sound-dd">
        <button type="button" class="cdd-btn" id="sound-dd-btn" onclick="toggleDropdown('sound-dd')">Happy Bells</button>
        <div class="cdd-list">
          <div class="cdd-item" onclick="pickSound('sounds/happy_bells.wav','Happy Bells')">Happy Bells</div>
          <div class="cdd-item" onclick="pickSound('sounds/uplifting_bells.wav','Uplifting Bells')">Uplifting Bells</div>
          <div class="cdd-item" onclick="pickSound('sounds/notification_bell.wav','Notification Bell')">Notification Bell</div>
          <div id="system-sound-items"></div>
        </div>
      </div>
      <input type="hidden" id="alarm-sound" value="sounds/happy_bells.wav">
    </div>
    <div class="alarm-row">
      <input type="time" id="alarm-time" value="07:00">
      <input type="text" id="alarm-name" placeholder="이름">
      <button class="btn-repeat" id="btn-repeat" onclick="toggleRepeatBtn()" title="매일 반복"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      <button class="btn-add" onclick="addAlarm()">추가</button>
    </div>
    <div class="alarm-list" id="alarm-list"></div>
    <div class="empty-msg" id="alarm-empty">등록된 알람 없음</div>
  </div>

  <div class="panel" id="panel-countdown">
    <div class="panel-title">카운트다운</div>
    <button class="close-panel" onclick="closePanel()">✕</button>
    <div class="cd-row">
      <input type="number" id="cd-h" placeholder="시" min=0 max=23>
      <span>:</span>
      <input type="number" id="cd-m" placeholder="분" min=0 max=59>
      <span>:</span>
      <input type="number" id="cd-s" placeholder="초" min=0 max=59>
      <button class="cd-save-btn" id="cd-save-btn" onclick="cdSavePreset()" title="현재 입력한 시간을 프리셋으로 저장">저장</button>
    </div>
    <div id="cd-display">00:00:00</div>
    <div class="cd-btns">
      <button onclick="cdStart()">시작</button>
      <button onclick="cdPause()">일시정지</button>
      <button onclick="cdReset()">초기화</button>
    </div>
    <div class="cd-preset-sec" id="cd-preset-sec">
      <div class="cd-preset-row" id="cd-preset-row"></div>
      <div class="cd-hint" id="cd-hint">클릭 = 설정 · 더블클릭 = 바로 시작</div>
    </div>
  </div>

// ── 7세그먼트 ──
const SEGS={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};
const SC={a:'seg seg-h seg-a',b:'seg seg-v seg-b',c:'seg seg-v seg-c',d:'seg seg-h seg-d',e:'seg seg-v seg-e',f:'seg seg-v seg-f',g:'seg seg-h seg-g'};
function md(){const el=document.createElement('div');el.className='seg-digit';'abcdefg'.split('').forEach(s=>{const sg=document.createElement('div');sg.className=SC[s]+' off';sg.dataset.seg=s;el.appendChild(sg);});return el;}
function mp(id){const c=document.getElementById(id);const d1=md(),d2=md();c.appendChild(d1);c.appendChild(d2);return[d1,d2];}
function sd(el,n){const on=SEGS[n]||'';el.querySelectorAll('.seg').forEach(s=>s.classList.toggle('off',!on.includes(s.dataset.seg)));}
function sn(p,n){const s=String(n).padStart(2,'0');sd(p[0],+s[0]);sd(p[1],+s[1]);}
const ph=mp('dh'),pm=mp('dm'),ps=mp('ds');

let showSec=true, brightness=220, panelColor='black', panelOpacity=0.5;
const alarmAudio=new Audio('sounds/alarm.wav');
alarmAudio.volume=0.6;
const txtClock=document.getElementById('text-clock');
const alarms=[];
let flashTimer=null;
let repeatMode=false;
let sizeDebounce=null;
let syncBusy=false, syncPending=false;
function toggleRepeatBtn(){
  repeatMode=!repeatMode;
  document.getElementById('btn-repeat').classList.toggle('active',repeatMode);
}

function upd(){
  const n=new Date();
  sn(ph,n.getHours());sn(pm,n.getMinutes());
  if(showSec) sn(ps,n.getSeconds());
  const h=String(n.getHours()).padStart(2,'0');
  const mi=String(n.getMinutes()).padStart(2,'0');
  const sc=String(n.getSeconds()).padStart(2,'0');
  txtClock.textContent=showSec?`${h}:${mi}:${sc}`:`${h}:${mi}`;
  const hm=`${h}:${mi}`;
  alarms.forEach(a=>{if(a.enabled&&a.t===hm&&n.getSeconds()===0){triggerAlarm(a.sound);if(!a.repeat){a.enabled=false;saveAlarms();renderAlarms();}}});
}
setInterval(upd,1000);upd();
changeStyle("'KoPubWorld Dotum Bold',sans-serif");

// 실제 렌더링되는 시계(7세그먼트 or 텍스트)의 내용물 너비만 측정 — #clock-area는 width:100%라
// 창 너비를 그대로 반영할 뿐이라 여기서 재기준으로 쓰면 안 됨.
function clockContentWidth(){
  const seg=document.getElementById('seg-wrap');
  const el=(seg.style.display==='none') ? txtClock : seg;
  return Math.ceil(el.getBoundingClientRect().width);
}
// 높이도 마찬가지로 실제 렌더링된 크기를 잰다 — #clock-row에 고정 height를 주면 7세그먼트를
// transform:scale로 키웠을 때(레이아웃 크기는 그대로고 화면에 보이는 크기만 커짐) 실제 차지하는
// 공간과 안 맞아서, getBoundingClientRect로 눈에 보이는 크기를 직접 측정.
function clockContentHeight(){
  const seg=document.getElementById('seg-wrap');
  const el=(seg.style.display==='none') ? txtClock : seg;
  return Math.ceil(el.getBoundingClientRect().height);
}
// 설정 패널(고정 300px 폭)이 열려있을 때만 300px 이상을 보장하고,
// 시계만 떠있는 평상시엔 실제 시계 크기만큼만 창을 줄여서 상하좌우 여백(=클릭 방해 영역)을 없앤다.
// 여백은 최대한 타이트하게(형 요청) — 안티에일리어싱 가장자리 정도만 여유를 둠.
// 최소 너비 200은 tauri.conf.json의 minWidth와 반드시 일치시킬 것 — 그보다 작은 값을 요청하면
// 네이티브 창이 실제로는 minWidth에 걸려서 멈추는데 위치 계산은 요청값 기준으로 해버려서
// 창이 계속 한쪽으로 밀리는 누적 오차가 생김.
async function syncWindowWidth(){
  if(syncBusy){ syncPending=true; return; }
  syncBusy=true;
  try {
    do {
      syncPending=false;
      const panelEl=document.querySelector('.panel.open');
      const w=Math.max(clockContentWidth()+14, 200, panelEl?300:0);
      // 90은 tauri.conf.json의 minHeight와 일치 — 이보다 작게 요청해봐야 네이티브 창은 안 줄어들면서
      // 요청값 기준 계산만 어긋나므로 의미 없음(폭의 200 하한과 동일한 이유).
      const h=Math.max(clockContentHeight()+10+(panelEl?panelEl.offsetHeight:0), 90);
      // 예전엔 패널 열 때 캡처해둔 위치(lockedPos)를 계속 재사용해서, 그 뒤로 창을 옮겼거나
      // 시간이 지나면 "그때 그 자리"로 되돌아가는 것처럼 보이는 문제가 있었음 —
      // 매번 지금 실제 위치를 새로 읽어서 그 자리 기준으로만 중심을 맞추도록 변경.
      const pos=await invoke('get_window_pos');
      const cx=pos[0]+Math.round(window.innerWidth/2);
      const newX=Math.max(0, cx - Math.round(w/2));
      // 크기(set_window_size)와 위치(set_window_pos)를 따로 왕복하면 그 사이에 프레임이
      // 끼어들어 "커졌다가 옮겨지는" 2단계 움직임이 떨림으로 보였음(2026-08-02) —
      // 한 커맨드(set_window_rect)로 합쳐서 왕복을 줄임.
      await invoke('set_window_rect',{x:newX,y:pos[1],width:w,height:h});
    } while(syncPending);
  } finally {
    // invoke 중 하나라도 실패하면 syncBusy가 true로 영원히 남아 이후 모든 리사이즈가
    // 무음으로 무시되는 걸 방지(오푸스 리뷰로 발견)
    syncBusy=false;
  }
}

// 네이티브 select의 옵션 목록은 OS 별도 팝업 창으로 뜨는데, 시계 창이 항상위(topmost)라
// 그 팝업이 시계 창 뒤로 깔려서 선택 자체가 안 되는 문제가 있었음(2026-08-02) — 순수 DOM
// 리스트로 대체해서 같은 창 안에서만 겹치게 함.
function closeAllDropdowns(except){
  let closedAny=false;
  document.querySelectorAll('.cdd-list.open').forEach(l=>{ if(l!==except){ l.classList.remove('open'); closedAny=true; } });
  // 목록 열 때 창을 넓혀줬던 걸 되돌림 — hideMenu()와 같은 패턴으로, 실제로 뭔가 닫혔을 때만
  // 리사이즈(닫혀있던 상태에서 매 클릭마다 불필요한 리사이즈가 도는 걸 방지)
  if(closedAny) setTimeout(syncWindowWidth,10);
}
function toggleDropdown(id){
  const list=document.querySelector('#'+id+' .cdd-list');
  const wasOpen=list.classList.contains('open');
  closeAllDropdowns();
  if(wasOpen) return;
  list.classList.add('open');
  // 옵션 목록이 패널 아래로 실제 창 높이를 넘어서면 네이티브 창 경계에 그대로 잘려서
  // (같은 창 안이라 클릭 자체는 되지만) 아래쪽 항목이 안 보이거나 안 눌리게 됨 —
  // 우클릭 메뉴(#ctx-menu)에서 이미 쓰던 것과 같은 방식으로 필요한 만큼만 창을 늘림.
  requestAnimationFrame(async ()=>{
    const rect=list.getBoundingClientRect();
    const extra=Math.ceil(rect.bottom)-window.innerHeight;
    if(extra>0){
      await invoke('set_window_size',{width:window.innerWidth,height:window.innerHeight+extra+4});
    }
  });
}

function previewSize(v){
  txtClock.style.fontSize=v+'px';
  const scale=v/40;
  const sw=document.getElementById('seg-wrap');
  sw.style.transform=`scale(${scale})`;
  // origin을 'center'로 두면 확대된 만큼 위로도 삐져나가는데, #clock-area가
  // flex-start라 위로 넘친 부분은 창 위쪽 바깥으로 잘려서 7세그먼트 상단이 잘려 보임
  // (오푸스 리뷰로 발견, 2026-08-02). center top으로 바꿔 아래쪽으로만 커지게 해서
  // clockContentHeight()가 재는 높이 안에 항상 다 들어오게 함.
  sw.style.transformOrigin='center top';
  // transform:scale()은 페인트에만 영향을 주고 문서 흐름상의 박스 크기(offsetHeight)는
  // 그대로라, #clock-row에 예약된 공간이 확대 전 크기(40px 기준)로 남아있음 —
  // 그래서 그 아래에 오는 설정 패널이 실제로 커진(확대된) 시계 위로 겹쳐 보이던 버그
  // (형이 발견, 2026-08-02). min-height를 실제 스케일된 높이로 직접 맞춰서 해결.
  // 텍스트 폰트 모드는 font-size로 직접 크기를 키워서 레이아웃 박스 자체가 이미
  // 시각적 크기와 일치하므로, 7세그먼트가 실제로 보일 때만 이 보정을 적용한다.
  document.getElementById('clock-row').style.minHeight = (sw.style.display!=='none') ? (sw.offsetHeight*scale)+'px' : '';
  document.getElementById('size-val').textContent=v;
}

// ── 알람 ──
// 번들 사운드는 'sounds/'로 시작하는 상대경로 그대로 재생하고, 시스템 사운드는
// 절대경로(예: C:\Windows\Media\...)로 알람에 저장해두고 재생 직전에 매번 바이트를
// 읽어와 Blob URL로 변환한다 — Blob URL은 세션마다 새로 만들어야 해서 저장해둔
// 절대경로를 원본으로 유지해야 재시작 후에도 계속 재생 가능하다(2026-08-02).
async function resolveSoundSrc(file){
  if(!file || file.startsWith('sounds/')) return file||'sounds/alarm.wav';
  try {
    const bytes = await invoke('read_system_sound', {path:file});
    const blob = new Blob([new Uint8Array(bytes)], {type:'audio/wav'});
    return URL.createObjectURL(blob);
  } catch(e) { return 'sounds/alarm.wav'; }
}
async function triggerAlarm(soundFile){
  if(flashTimer) return;
  const cr=document.getElementById('clock-area');
  cr.classList.add('flashing');
  const src = await resolveSoundSrc(soundFile);
  alarmAudio.src=src;
  alarmAudio.currentTime=0;
  alarmAudio.loop=true;
  alarmAudio.play().catch(()=>{});
  flashTimer=setTimeout(stopAlarm, 30000);
}
let previewAudioEl=null, previewToken=0;
async function previewAlarmSound(file){
  // 매번 new Audio()로 새 인스턴스를 만들어서 이전에 재생중이던 미리듣기가
  // 안 멈추고 겹쳐 들리던 문제 — 재생중인걸 즉시 멈추고, 비동기 경로 변환(resolveSoundSrc)
  // 도중에 또 다른 소리를 눌렀으면 먼저 것의 결과는 버린다(순서 역전 방지, 2026-08-02).
  const myToken=++previewToken;
  if(previewAudioEl){ previewAudioEl.pause(); }
  const src = await resolveSoundSrc(file);
  if(myToken!==previewToken) return;
  const p=new Audio(src);
  previewAudioEl=p;
  p.volume=0.6;
  p.play().catch(()=>{});
}
function stopAlarm(){
  if(!flashTimer) return;
  clearTimeout(flashTimer); flashTimer=null;
  document.getElementById('clock-area').classList.remove('flashing');
  alarmAudio.pause(); alarmAudio.currentTime=0;
}
function saveAlarms(){ localStorage.setItem('alarms',JSON.stringify(alarms)); }
function addAlarm(){
  const t=document.getElementById('alarm-time').value;
  const name=document.getElementById('alarm-name').value.trim()||'알람';
  const sound=document.getElementById('alarm-sound').value;
  if(!t) return;
  alarms.push({id:Date.now(),t,name,enabled:true,repeat:repeatMode,sound});
  document.getElementById('alarm-name').value='';
  repeatMode=false;
  document.getElementById('btn-repeat').classList.remove('active');
  saveAlarms();
  renderAlarms();
}
function toggleAlarm(id){ const a=alarms.find(x=>x.id===id); if(a) a.enabled=!a.enabled; saveAlarms(); renderAlarms(); }
function removeAlarm(id){ alarms.splice(alarms.findIndex(a=>a.id===id),1); saveAlarms(); renderAlarms(); }
let editingAlarmId=null, editingRepeat=false;
function editAlarm(id){
  const a=alarms.find(x=>x.id===id);
  if(!a) return;
  editingAlarmId=id;
  editingRepeat=!!a.repeat;
  renderAlarms();
}
function toggleEditRepeat(){ editingRepeat=!editingRepeat; renderAlarms(); }
function cancelAlarmEdit(){ editingAlarmId=null; renderAlarms(); }
function saveAlarmEdit(id){
  const a=alarms.find(x=>x.id===id);
  if(!a) return;
  const t=document.getElementById('edit-time-'+id).value;
  const name=document.getElementById('edit-name-'+id).value.trim()||'알람';
  if(!t) return;

let dragCtx=null;
function startAlarmDrag(e, item){
  if(e.button!==0 || e.target.closest('.alarm-toggle,.alarm-del')) return;
  e.preventDefault();
  const list=document.getElementById('alarm-list');
  const children=Array.from(list.children);
  const idx=children.indexOf(item);
  const itemH=item.offsetHeight+4;
  dragCtx={item, idx, curIdx:idx, list, children, startY:e.clientY, itemH};
  item.classList.add('dragging');
  document.addEventListener('mousemove', onAlarmDragMove);
  document.addEventListener('mouseup', onAlarmDragEnd);
}
function onAlarmDragMove(e){
  if(!dragCtx) return;
  const dy=e.clientY-dragCtx.startY;
  dragCtx.item.style.transform=`translateY(${dy}px)`;
  const steps=Math.round(dy/dragCtx.itemH);
  const newIdx=Math.min(dragCtx.children.length-1, Math.max(0, dragCtx.idx+steps));
  if(newIdx!==dragCtx.curIdx){
    dragCtx.children.forEach((sib,j)=>{
      if(sib===dragCtx.item) return;
      let shift=0;
      if(newIdx>dragCtx.idx && j>dragCtx.idx && j<=newIdx) shift=-dragCtx.itemH;
      else if(newIdx<dragCtx.idx && j<dragCtx.idx && j>=newIdx) shift=dragCtx.itemH;
      sib.style.transition='transform 0.15s ease';
      sib.style.transform=`translateY(${shift}px)`;
    });
    dragCtx.curIdx=newIdx;
  }
}
function onAlarmDragEnd(){
  if(!dragCtx) return;
  const {item, idx, curIdx, children}=dragCtx;
  document.removeEventListener('mousemove', onAlarmDragMove);
  document.removeEventListener('mouseup', onAlarmDragEnd);
  item.classList.remove('dragging');
  item.style.transition=''; item.style.transform='';
  children.forEach(c=>{ if(c!==item){ c.style.transition=''; c.style.transform=''; } });
  dragCtx=null;
  if(curIdx!==idx){
    const moved=alarms.splice(idx,1)[0];
    alarms.splice(curIdx,0,moved);
    saveAlarms();
    renderAlarms();
  }
}

let cdRemain=0,cdTimer=null,cdRunning=false;
const CD_PRESET_MAX=4;
let cdPresets=[null,null,null,null];
let cdPickMode=false;
let cdNamingIdx=-1;
let cdEditIdx=-1;
let cdSuppressClick=false;

function saveCdPresets(){ localStorage.setItem('cdPresets', JSON.stringify(cdPresets)); }
function loadCdPresets(){
  try{
    const raw=localStorage.getItem('cdPresets');
    if(!raw) return;
    const arr=JSON.parse(raw);
    if(!Array.isArray(arr)) return;
    for(let i=0;i<CD_PRESET_MAX;i++){
      const p=arr[i];
      cdPresets[i]=(p&&typeof p.sec==='number'&&p.sec>0)
        ? { sec:p.sec, name: typeof p.name==='string' ? p.name : '' }
        : null;
    }
  }catch(e){}
}
function fmtPreset(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function cdInputSec(){
  const h=parseInt(document.getElementById('cd-h').value)||0;
  const m=parseInt(document.getElementById('cd-m').value)||0;
  const s=parseInt(document.getElementById('cd-s').value)||0;
  return h*3600+m*60+s;
}
function cdFillInputs(sec){
  document.getElementById('cd-h').value=Math.floor(sec/3600)||'';
  document.getElementById('cd-m').value=Math.floor((sec%3600)/60)||'';
  document.getElementById('cd-s').value=sec%60||'';
}
const CD_EDIT_ICON=`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>`;
function renderCdPresets(){
  const row=document.getElementById('cd-preset-row');
  row.innerHTML='';
  for(let i=0;i<CD_PRESET_MAX;i++){
    const p=cdPresets[i];
    const el=document.createElement('div');
    el.className='cd-preset'+(p?'':' empty')+(cdPickMode?' pick':'')+(i===cdEditIdx?' editing':'');
    if((i===cdNamingIdx||i===cdEditIdx)&&p){
      const editing=(i===cdEditIdx);
      el.innerHTML=`<input type="text" id="cd-preset-name-${i}" value="${p.name.replace(/"/g,'&quot;')}" placeholder="이름" maxlength="10">`;
      row.appendChild(el);
      const inp=el.querySelector('input');
      inp.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ editing ? commitCdPresetEdit(i) : commitCdPresetName(i); }
        else if(e.key==='Escape'){ editing ? cancelCdPresetEdit() : (cdNamingIdx=-1, renderCdPresets()); }
      });
      if(!editing) inp.addEventListener('blur', ()=>{ if(cdNamingIdx===i) commitCdPresetName(i); });
      setTimeout(()=>inp.focus(),0);
      continue;
    }
    if(p){
      el.title=`${fmtPreset(p.sec)}${p.name?' '+p.name:''} — 클릭: 설정 / 더블클릭: 바로 시작 / 끌어서 순서 변경`;
      el.innerHTML=`<button class="cd-preset-edit" title="시간·이름 수정">${CD_EDIT_ICON}</button>`
        + `<span class="p-time">${fmtPreset(p.sec)}</span>`
        + (p.name ? `<span class="p-name">${p.name}</span>` : '')
        + `<button class="cd-preset-del" title="삭제">✕</button>`;
      el.querySelector('.cd-preset-del').onclick=e=>{ e.stopPropagation(); removeCdPreset(i); };
      el.querySelector('.cd-preset-edit').onclick=e=>{ e.stopPropagation(); startCdPresetEdit(i); };
      el.onclick=()=>{
        if(cdSuppressClick) return;
        if(cdEditIdx>=0) return;
        cdPickMode ? writeCdPreset(i) : applyCdPreset(i);
      };
      el.ondblclick=()=>{ if(!cdPickMode&&cdEditIdx<0){ applyCdPreset(i); cdStart(); } };
      el.addEventListener('mousedown', e=>startCdPresetDrag(e, el, i));
    } else {
      el.textContent='+';
      el.title='현재 입력한 시간을 이 칸에 저장';
      el.onclick=()=>{ if(cdEditIdx<0) writeCdPreset(i); };
    }
    row.appendChild(el);
  }
  updateCdHint();
}
function updateCdHint(){
  const hint=document.getElementById('cd-hint');
  if(cdEditIdx>=0){ hint.textContent='시간 수정 후 저장 · Esc 취소'; hint.classList.add('picking'); return; }
  if(cdNamingIdx>=0){ hint.textContent='이름 입력 후 Enter (비우면 시간만)'; hint.classList.add('picking'); return; }
  if(cdPickMode){ hint.textContent='덮어쓸 칸을 클릭 (Esc 취소)'; hint.classList.add('picking'); return; }
  hint.textContent='클릭=설정 · 더블클릭=시작 · 드래그=순서';
  hint.classList.remove('picking');
}
function applyCdPreset(i){
  const p=cdPresets[i];
  if(!p||cdRunning) return;
  cdFillInputs(p.sec);
  cdPause();
  cdRemain=p.sec;
  renderCd();
}
function startCdPresetEdit(i){
  if(cdRunning||!cdPresets[i]) return;
  cdPickMode=false;
  cdNamingIdx=-1;
  cdEditIdx=i;
  cdFillInputs(cdPresets[i].sec);
  renderCdPresets();
  syncSaveBtn();
}
function commitCdPresetEdit(i){
  const p=cdPresets[i];
  if(!p){ cancelCdPresetEdit(); return; }
  const inp=document.getElementById('cd-preset-name-'+i);
  const sec=cdInputSec();
  if(sec>0) p.sec=sec;
  if(inp) p.name=inp.value.trim().slice(0,10);
  cdEditIdx=-1;
  saveCdPresets();
  renderCdPresets();
  syncSaveBtn();
}
function cancelCdPresetEdit(){
  cdEditIdx=-1;
  renderCdPresets();
  syncSaveBtn();
}
function cdSavePreset(){
  if(cdRunning) return;
  if(cdEditIdx>=0){ commitCdPresetEdit(cdEditIdx); return; }
  if(cdPickMode){ cdPickMode=false; renderCdPresets(); syncSaveBtn(); return; }
  if(cdInputSec()<=0) return;
  const empty=cdPresets.indexOf(null);
  if(empty>=0){ writeCdPreset(empty); return; }
  cdPickMode=true;
  renderCdPresets();
  syncSaveBtn();
}
function writeCdPreset(i){
  const sec=cdInputSec();
  if(sec<=0) return;
  cdPresets[i]={ sec, name:'' };
  cdPickMode=false;
  cdNamingIdx=i;
  saveCdPresets();
  renderCdPresets();
  syncSaveBtn();
}
function commitCdPresetName(i){
  const inp=document.getElementById('cd-preset-name-'+i);
  if(inp&&cdPresets[i]) cdPresets[i].name=inp.value.trim().slice(0,10);
  cdNamingIdx=-1;
  saveCdPresets();
  renderCdPresets();
}
function removeCdPreset(i){
  cdPresets[i]=null;

  renderCdPresets();

}
let cdDragCtx=null;
function startCdPresetDrag(e, item, idx){
  if(e.button!==0) return;
  if(cdPickMode||cdNamingIdx>=0||cdEditIdx>=0) return;
  if(cdRunning||!cdPresets[idx]) return;
  if(e.target.closest('.cd-preset-del,.cd-preset-edit,input')) return;
  e.preventDefault();
  const row=document.getElementById('cd-preset-row');
  const children=Array.from(row.children);
  const itemW=item.offsetWidth+5;
  cdDragCtx={ item, idx, curIdx:idx, children, startX:e.clientX, itemW };
  item.classList.add('dragging');
  document.addEventListener('mousemove', onCdPresetDragMove);
  document.addEventListener('mouseup', onCdPresetDragEnd);
}
function onCdPresetDragMove(e){
  if(!cdDragCtx) return;
  const dx=e.clientX-cdDragCtx.startX;
  cdDragCtx.item.style.transform=`translateX(${dx}px)`;
  const steps=Math.round(dx/cdDragCtx.itemW);
  const newIdx=Math.min(cdDragCtx.children.length-1, Math.max(0, cdDragCtx.idx+steps));
  if(newIdx!==cdDragCtx.curIdx){
    cdDragCtx.children.forEach((sib,j)=>{
      if(sib===cdDragCtx.item) return;
      let shift=0;
      if(newIdx>cdDragCtx.idx && j>cdDragCtx.idx && j<=newIdx) shift=-cdDragCtx.itemW;
      else if(newIdx<cdDragCtx.idx && j<cdDragCtx.idx && j>=newIdx) shift=cdDragCtx.itemW;
      sib.style.transition='transform 0.15s ease';
      sib.style.transform=`translateX(${shift}px)`;
    });
    cdDragCtx.curIdx=newIdx;
  }
}
function onCdPresetDragEnd(){
  if(!cdDragCtx) return;
  const { item, idx, curIdx, children }=cdDragCtx;
  document.removeEventListener('mousemove', onCdPresetDragMove);
  document.removeEventListener('mouseup', onCdPresetDragEnd);
  item.classList.remove('dragging');
  item.style.transition=''; item.style.transform='';
  children.forEach(c=>{ if(c!==item){ c.style.transition=''; c.style.transform=''; } });
  cdDragCtx=null;
  if(curIdx!==idx){
    const moved=cdPresets.splice(idx,1)[0];
    cdPresets.splice(curIdx,0,moved);
    saveCdPresets();
    renderCdPresets();
    cdSuppressClick=true;

}
function syncSaveBtn(){

}
document.addEventListener('keydown', e=>{

function cdStart(){

function cdReset(){cdPause();cdRemain=0;document.getElementById('cd-display').textContent='00:00:00';}

const UPD_APP       = 'kclock';

const UPD_MAX_VERS  = 3;

const UPD_KEY_SEEN  = UPD_APP + '.updateNotice.lastSeen';
const UPDATE_NOTES = [
  { version:'1.3.10', date:'2026-08-22', items:[
      '비활성화된 알람을 수정해서 저장하면 자동으로 다시 켜집니다.',

      '카운트다운에 자주 쓰는 시간을 최대 4개까지 저장해서 바로 불러올 수 있습니다.',

  ]}
];
function updCmpVersion(a, b){
  const split = v => {
    const [rel, pre] = String(v).split('-');
    return { rel: rel.split('.').map(n => parseInt(n,10) || 0), pre: pre || null };
  };
  const A = split(a), B = split(b);
  for (let i = 0; i < Math.max(A.rel.length, B.rel.length); i++){
    const d = (A.rel[i] || 0) - (B.rel[i] || 0);
    if (d !== 0) return d > 0 ? 1 : -1;
  }
  if (A.pre === B.pre) return 0;
  if (A.pre === null) return 1;
  if (B.pre === null) return -1;
  return A.pre > B.pre ? 1 : -1;
}
const UPD_LEGACY_KEYS = ['alarms','cdPresets','panelColor','panelOpacity'];
function updHasLegacyData(){
  return UPD_LEGACY_KEYS.some(k => localStorage.getItem(k) !== null);
}
function updDecide(){
  let seen = null;
  try { seen = localStorage.getItem(UPD_KEY_SEEN); } catch(e) { return null; }
  if (seen === null){
    const mode = updHasLegacyData() ? 'update' : 'fresh';
    const n = (mode === 'fresh') ? 2 : UPD_MAX_VERS;
    return { mode, notes: UPDATE_NOTES.slice(0, n) };
  }
  if (updCmpVersion(APP_VERSION, seen) <= 0) return null;
  const notes = UPDATE_NOTES
    .filter(n => updCmpVersion(n.version, seen) > 0)
    .slice(0, UPD_MAX_VERS);
  if (!notes.length) return null;
  return { mode:'update', notes };
}
function updEscape(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function updRender(cardEl, mode, notes){
  const headline = (mode === 'fresh') ? '최근 변경 내역' : '업데이트가 적용됐습니다';
  const body = notes.map(n => `
      <div class="upd-ver">
        <div class="upd-ver-head">
          <span class="upd-ver-num">${updEscape(n.version)}</span>
          <span class="upd-ver-date">${updEscape(n.date)}</span>
        </div>
        <ul class="upd-list">
          ${n.items.map(t => `<li class="upd-item">${updEscape(t)}</li>`).join('')}
        </ul>
      </div>`).join('');
  const keepTitle = cardEl.querySelector('.upd-title');
  cardEl.innerHTML =
    (keepTitle ? keepTitle.outerHTML : '') + `

      <span class="upd-badge">v${updEscape(APP_VERSION)}</span>
      <span class="upd-headline">${updEscape(headline)}</span>
    </div>
    <div class="upd-body">${body}</div>
    <div class="upd-foot">
      <a class="upd-more" href="${updEscape(UPD_MORE_URL)}" target="_blank" rel="noopener">전체 변경 내역</a>
      <button class="upd-ok" onclick="closeUpdateNotice()">확인</button>
    </div>`;
  const more = cardEl.querySelector('.upd-more');
  if (more) more.addEventListener('click', updOnMoreClick);
}
function updOnMoreClick(e){
  if (!UPD_OPEN_EXTERNAL) return;
  e.preventDefault();
  try { UPD_OPEN_EXTERNAL(e.currentTarget.href); } catch(err) {}
}
function updMarkSeen(){
  try { localStorage.setItem(UPD_KEY_SEEN, APP_VERSION); } catch(e) {}
}
function isUpdateNoticeOpen(){
  const p = document.getElementById('panel-update');
  return !!(p && p.classList.contains('open'));
}
function closeUpdateNotice(){
  updMarkSeen();
  const p = document.getElementById('panel-update');
  if (p) p.classList.remove('open');
  setTimeout(syncWindowWidth,10);
}
function initUpdateNotice(){
  const decision = updDecide();
  if (!decision) return;
  const card = document.querySelector('#panel-update .upd-card');
  if (!card) return;
  updRender(card, decision.mode, decision.notes);
  document.getElementById('panel-update').classList.add('open');
  setTimeout(syncWindowWidth,10);
}

// 슬라이더 max 강제 설정 (캐시 무효화)
(function(){
  const sl=document.getElementById('size-slider');
  sl.max=100;
  if(parseInt(sl.value)>100){ sl.value=100; document.getElementById('size-val').textContent=100; }
})();

// 알람 복원
(function(){
  try{
    const saved=localStorage.getItem('alarms');
    if(saved){ const arr=JSON.parse(saved); arr.forEach(a=>alarms.push(a)); renderAlarms(); }
  }catch(e){}
})();

// 카운트다운 프리셋 복원
loadCdPresets();
renderCdPresets();
syncSaveBtn();

// 설정 복원
(function(){
  const c=localStorage.getItem('panelColor')||'black';
  const op=parseInt(localStorage.getItem('panelOpacity')||'50');
  panelColor=c; panelOpacity=op/100;
  document.getElementById('panel-opacity-slider').value=op;
  document.getElementById('panel-op-val').textContent=op;
  document.getElementById('btn-black').classList.toggle('active',c==='black');
  document.getElementById('btn-white').classList.toggle('active',c==='white');
  updatePanelBg();
})();

// 업데이트 안내 (다른 초기화가 전부 끝난 뒤 마지막에 판단)
initUpdateNotice();
</script>
</body>
</html>
