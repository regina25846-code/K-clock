name: Build K-Clock

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: npm install

      - name: Build Tauri app
        # ⚠️ 반드시 build:protected 여야 한다 (PND-0113, 2026-09-05 추가).
        # `npm run build` 는 dist/ 를 그대로 실어 보내서 개발 주석(형 요청 원문 포함)과
        # 읽기 좋은 원본 소스가 설치파일 안에 통째로 들어간다. build:protected 는
        # dist/ 를 dist-protected/ 로 다시 쓰면서(주석 제거 + 이름 뭉개기) 검사를 통과한
        # 뒤에만 빌드한다. 검사가 실패하면 여기서 빌드가 멈춘다.
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Get version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> $GITHUB_OUTPUT

      - name: Create update/latest.json
        # 테스트빌드(버전에 하이픈, 예: 1.3.10-1)는 자동업데이트 피드를 절대 건드리지 않는다 —
        # 이 파일이 곧 "현재 최신"을 가리키는 실배포 신호라서, 만들지 않는 것 자체가 안전장치다
        # (2026-08-24 오푸스 검토로 과거 33회 실유출 확인 후 추가).
        if: ${{ !contains(steps.ver.outputs.version, '-') }}
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Tauri NSIS는 .nsis.zip이 아니라 설치 exe 자체를 바로 서명한다(createUpdaterArtifacts
          # 활성화 후 실측 확인: K-Clock_x.x.x_x64-setup.exe.sig 로 생성됨).
          SIG=$(cat src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig 2>/dev/null || cat src-tauri/target/release/bundle/nsis/*.exe.sig 2>/dev/null || echo "")
          # minisign .sig 파일은 여러 줄(주석+base64)이라 그대로 JSON 문자열에 넣으면 깨짐 — 한 줄로 압축
          SIG=$(echo "$SIG" | tr -d '\r\n')
          # 서명 파일을 못 찾으면(아티팩트 이름 규칙이 다시 바뀌는 등) 빈 서명으로 조용히
          # 성공 처리하지 않고 여기서 바로 실패시킴 — 안 그러면 latest.json이 서명 없이
          # master에 올라가서 전 사용자 자동업데이트가 조용히 깨짐(오푸스 리뷰로 발견)
          if [ -z "$SIG" ]; then
            echo "::error::서명 파일(.exe.sig)을 찾지 못함 — latest.json을 빈 서명으로 커밋하지 않고 중단"
            exit 1
          fi
          URL="https://github.com/regina25846-code/K-clock/releases/download/v${VERSION}/K-Clock_${VERSION}_x64-setup.exe"
          mkdir -p update
          printf '{\n  "version": "%s",\n  "notes": "K-Clock v%s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "%s"\n    }\n  }\n}\n' \
            "$VERSION" "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIG" "$URL" > update/latest.json
          cat update/latest.json

      - name: Commit update/latest.json
        if: ${{ !contains(steps.ver.outputs.version, '-') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/latest.json
          git diff --staged --quiet || git commit -m "chore: K-Clock v${{ steps.ver.outputs.version }} 업데이트 정보"
          git push || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: K-Clock-${{ steps.ver.outputs.version }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: K-Clock v${{ steps.ver.outputs.version }}
          # 버전에 하이픈(테스트빌드)이 있으면 자동으로 prerelease 처리 — K-Zone과 동일 로직.
          # 이게 없으면 /releases/latest API와 다운로드 페이지가 테스트빌드를 "최신 정식"으로
          # 잘못 가리킨다(2026-08-24 오푸스 검토로 과거 34개 릴리즈 전부 이 플래그 없이 공개돼
          # 있었던 것 확인 후 추가).
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          body: K-Clock v${{ steps.ver.outputs.version }} 릴리즈
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          fail_on_unmatched_files: false

      - name: Deploy Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          # ⚠️ 이 줄을 지우지 말 것 (2026-09-03 추가).
          # 이 액션은 gh-pages 브랜치를 통째로 교체하므로 CNAME 파일이 매 배포마다 사라진다.
          # CNAME 이 없으면 GitHub Pages 가 커스텀 도메인 설정까지 같이 지워서
          # clock.krisb-infra.com 이 404 가 된다 — 8/27 에 손으로 복구했는데 8/31 배포가
          # 다시 지웠고(커밋 572dda5 → 1f736a3), 형이 두 번째로 404 를 겪었다.
          # 이 옵션을 주면 배포할 때마다 CNAME 을 자동으로 만들어 준다.
          cname: clock.krisb-infra.com
