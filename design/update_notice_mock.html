<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>K-Clock 업데이트 안내 시안</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   K-시리즈 공용 "업데이트 안내" 컴포넌트 시안 (2026-08-21) — K-Clock 파일럿

   구조 = [셸] + [카드]
     · 카드(.upd-card 이하)  : 5개 앱 공용. 프레임워크 무관 순수 HTML/CSS/JS.
                              색은 전부 CSS 변수라 앱별로 --upd-* 만 덮으면 됨.
     · 셸                    : 앱별로 다름.
        - K-Clock  → .upd-shell--panel : 기존 .panel 을 그대로 재사용(패널형)
        - K-Zone/Tube/Memo/Music → .upd-shell--modal : 딤 배경 + 중앙 모달

   ※ 아래 "원본 값" 블록은 dist/index.html에서 리터럴 그대로 복사(근사치 아님).
     구현 시 <style>에 추가할 것은 "신규" 블록뿐이다.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 시안 전용(실제 앱에는 넣지 않음) ── */
body.mock { background:#2b2f36; min-height:100vh; display:flex; align-items:flex-start;
            justify-content:center; padding:36px 24px; gap:36px; flex-wrap:wrap; }
.mock-stage { display:flex; flex-direction:column; align-items:center; }
.mock-caption { font-family:'Segoe UI',sans-serif; font-size:11px; color:#8a8f98; margin-top:10px;
                text-align:center; line-height:1.6; max-width:320px; }
.mock-caption b { color:#c9a35c; font-weight:600; }
.mock-fakeclock { font-family:'Consolas',monospace; font-size:34px; color:#b8b8b8;
                  letter-spacing:2px; font-weight:300; margin-bottom:2px; }
.mock-win { width:420px; height:360px; border-radius:8px; overflow:hidden; position:relative;
            background:#141414; border:1px solid rgba(255,255,255,0.10); }
.mock-win.light { background:#f4f5f7; }
.mock-winbar { height:26px; background:rgba(255,255,255,0.05); border-bottom:1px solid rgba(255,255,255,0.07);
               display:flex; align-items:center; padding:0 9px; gap:5px; }
.mock-win.light .mock-winbar { background:rgba(0,0,0,0.04); border-bottom-color:rgba(0,0,0,0.08); }
.mock-dot3 { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.18); }
.mock-win.light .mock-dot3 { background:rgba(0,0,0,0.18); }
.mock-winbody { font-family:'Segoe UI',sans-serif; font-size:11px; color:rgba(255,255,255,0.20);
                padding:14px; line-height:1.9; }
.mock-win.light .mock-winbody { color:rgba(0,0,0,0.20); }

/* ══════ dist/index.html에서 복사한 원본 값 (변경 금지) ══════ */
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
body { font-family:'Segoe UI',sans-serif; }

.panel { width:300px; background:rgba(0,0,0,0.5); border-radius:0 0 10px 10px; padding:10px 14px; position:relative; display:none; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.panel.open { display:block; }
.panel-title { font-size:14px; color:rgba(184,184,184,0.9); font-weight:600; margin-bottom:10px; }
.close-panel { position:absolute; top:8px; right:10px; color:rgba(184,184,184,0.5); font-size:13px; background:none; border:none; cursor:pointer; }

/* ══════════════════════ 신규: 업데이트 안내 카드 ══════════════════════ */

/* 카드 토큰 — 기본값은 K-Clock 다크 톤.
   포팅 시 앱별로 이 6개만 덮어쓰면 나머지 규칙은 그대로 재사용된다. */
.upd-card {
  --upd-accent : #c9a35c;                    /* 새 소식 강조(금색). 초록 #4a9은 "on/활성" 의미로 이미 점유돼 있어 재사용하지 않음 */
  --upd-fg     : #b8b8b8;                    /* 본문 */
  --upd-dim    : #777;                       /* 보조 안내문구 톤(기존 .empty-msg/.cd-hint와 동일) */
  --upd-line   : rgba(255,255,255,0.08);     /* 구분선(기존 .setting-row/.alarm-item과 동일) */
  --upd-ctl-bg : rgba(255,255,255,0.08);     /* 컨트롤 배경(기존 input/button과 동일) */
  --upd-ctl-br : rgba(255,255,255,0.15);     /* 컨트롤 테두리(기존 input/button과 동일) */
  display:block;
}

/* 헤더 : [v1.3.9] 업데이트 완료 */
.upd-head { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.upd-badge { flex-shrink:0; font-size:10px; line-height:1.2; padding:1px 5px;
             border:1px solid var(--upd-accent); border-radius:4px; color:var(--upd-accent);
             font-family:'Consolas',monospace; }
.upd-headline { min-width:0; font-size:12px; color:rgba(184,184,184,0.9);
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* 본문 : 스크롤 영역. max-height 180px = 기존 .alarm-list와 동일(패널 높이 폭주 방지) */
.upd-body { max-height:180px; overflow-y:auto; overflow-x:hidden; }
.upd-body::-webkit-scrollbar { width:5px; }
.upd-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }
.upd-body::-webkit-scrollbar-track { background:transparent; }

/* 버전 블록 — 건너뛴 버전이 여러 개면 이 블록이 반복된다 */
.upd-ver { padding:6px 0; border-bottom:1px solid var(--upd-line); }
.upd-ver:first-child { padding-top:0; }
.upd-ver:last-child { border-bottom:none; padding-bottom:0; }
.upd-ver-head { display:flex; align-items:baseline; gap:5px; margin-bottom:4px; }
.upd-ver-num { font-size:11px; color:var(--upd-fg); font-family:'Consolas',monospace; }
.upd-ver-date { font-size:10px; color:var(--upd-dim); }

/* 항목 — 마크다운 없는 plain text 한 줄이 <li> 하나 */
.upd-list { list-style:none; display:flex; flex-direction:column; gap:3px; }
.upd-item { position:relative; padding-left:9px; font-size:11px; line-height:1.5;
            color:var(--upd-fg); word-break:keep-all; }
.upd-item::before { content:''; position:absolute; left:2px; top:7px; width:3px; height:3px;
                    border-radius:50%; background:rgba(184,184,184,0.35); }

/* 푸터 : 보조 링크 + 확인 버튼 */
.upd-foot { display:flex; align-items:center; justify-content:space-between; gap:6px;
            margin-top:8px; padding-top:8px; border-top:1px solid var(--upd-line); }
.upd-more { font-size:10px; color:var(--upd-dim); text-decoration:none; cursor:pointer; }
.upd-more:hover { color:var(--upd-fg); text-decoration:underline; }
.upd-ok { flex-shrink:0; padding:4px 14px; background:var(--upd-ctl-bg); color:var(--upd-fg);
          border:1px solid var(--upd-ctl-br); border-radius:5px; font-size:11px;
          cursor:pointer; font-family:inherit; }
.upd-ok:hover { background:rgba(255,255,255,0.14); }

/* 등장 연출 — opacity만. transform/height 애니메이션은 쓰지 않는다.
   K-Clock은 패널이 열릴 때 네이티브 창을 같이 리사이즈하는데(syncWindowWidth),
   그 프레임에 겹쳐서 카드가 움직이면 2026-08-02에 잡았던 "떨림"이 그대로 재발한다. */
@keyframes updIn { from { opacity:0 } to { opacity:1 } }
.upd-card { animation:updIn 0.18s ease-out; }
@media (prefers-reduced-motion: reduce) { .upd-card { animation:none } }

/* ══════ 셸 A : K-Clock (패널형) ══════
   별도 규칙이 필요 없다 — 기존 .panel/.panel-title/.close-panel을 그대로 쓴다.
   #panel-update 는 알람/카운트다운/설정과 형제로 들어가고, 창 크기 조절도
   기존 syncWindowWidth()가 그대로 처리한다(신규 리사이즈 코드 0줄). */

/* ══════ 셸 B : K-Zone/K-Tube/K-Memo/K-Music (모달형) ══════ */
.upd-shell--modal { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
                    background:rgba(0,0,0,0.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
                    z-index:9000; }
.upd-shell--modal.open { display:flex; }
.upd-shell--modal .upd-card { width:360px; padding:14px; border-radius:10px;
                              background:#1e1e1e;                                  /* 기존 .cdd-list/select option과 동일한 떠있는 면 색 */
                              border:1px solid rgba(255,255,255,0.12);
                              box-shadow:0 12px 40px rgba(0,0,0,0.6); position:relative; }
.upd-shell--modal .upd-title { font-size:14px; color:rgba(184,184,184,0.9); font-weight:600; margin-bottom:10px; }
.upd-shell--modal .upd-body { max-height:220px; }

/* 모달 셸 라이트 테마.
   K-Clock 자체는 라이트가 필요 없다(투명 오버레이 위젯이고, 패널 흰색 옵션은
   기존 패널들과 동일하게 --upd-* 기본값을 그대로 물려받아 톤이 이미 일치한다).
   반면 K-Memo/K-Tube 등은 실제 라이트 모드가 있으므로 모달 셸에만 정의한다. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .upd-shell--modal { background:rgba(0,0,0,0.35); }
  :root:not([data-theme="dark"]) .upd-shell--modal .upd-card {
    --upd-fg:#3a3a3a; --upd-dim:#8a8a8a;
    --upd-line:rgba(0,0,0,0.10); --upd-ctl-bg:rgba(0,0,0,0.04); --upd-ctl-br:rgba(0,0,0,0.15);
    background:#ffffff; border-color:rgba(0,0,0,0.12); box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  :root:not([data-theme="dark"]) .upd-shell--modal .upd-headline,
  :root:not([data-theme="dark"]) .upd-shell--modal .upd-title { color:#3a3a3a; }
  :root:not([data-theme="dark"]) .upd-shell--modal .upd-item::before { background:rgba(0,0,0,0.30); }
  :root:not([data-theme="dark"]) .upd-shell--modal .upd-ok:hover { background:rgba(0,0,0,0.08); }
  :root:not([data-theme="dark"]) .upd-shell--modal .upd-body::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.20); }
}
/* 앱이 직접 테마를 stamp 하는 경우(K-Memo 등)는 data-theme 가 미디어쿼리를 이긴다.
   .mock-win.light 는 시안에서 라이트 상태를 한 화면에 같이 보여주기 위한 선택자로,
   실제 포팅 시에는 :root[data-theme="light"] 쪽만 가져가면 된다. */
:root[data-theme="light"] .upd-shell--modal,
.mock-win.light .upd-shell--modal { background:rgba(0,0,0,0.35); }
:root[data-theme="light"] .upd-shell--modal .upd-card,
.mock-win.light .upd-shell--modal .upd-card {
  --upd-fg:#3a3a3a; --upd-dim:#8a8a8a;
  --upd-line:rgba(0,0,0,0.10); --upd-ctl-bg:rgba(0,0,0,0.04); --upd-ctl-br:rgba(0,0,0,0.15);
  background:#ffffff; border-color:rgba(0,0,0,0.12); box-shadow:0 12px 40px rgba(0,0,0,0.25);
}
:root[data-theme="light"] .upd-shell--modal .upd-headline,
:root[data-theme="light"] .upd-shell--modal .upd-title,
.mock-win.light .upd-shell--modal .upd-headline,
.mock-win.light .upd-shell--modal .upd-title { color:#3a3a3a; }
:root[data-theme="light"] .upd-shell--modal .upd-item::before,
.mock-win.light .upd-shell--modal .upd-item::before { background:rgba(0,0,0,0.30); }
:root[data-theme="light"] .upd-shell--modal .upd-ok:hover,
.mock-win.light .upd-shell--modal .upd-ok:hover { background:rgba(0,0,0,0.08); }
:root[data-theme="light"] .upd-shell--modal .upd-body::-webkit-scrollbar-thumb,
.mock-win.light .upd-shell--modal .upd-body::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.20); }
</style>
</head>
<body class="mock">

<!-- ────────── 1) K-Clock 실제 형태 : 기존 유저(자동업데이트 직후) ────────── -->
<div class="mock-stage">
  <div class="mock-fakeclock">14:32:07</div>
  <div class="panel open" id="panel-update">
    <div class="panel-title">업데이트 안내</div>
    <button class="close-panel" onclick="closeUpdateNotice()">✕</button>
    <div class="upd-card" id="upd-card-a"></div>
  </div>
  <div class="mock-caption"><b>기존 유저</b> · 자동 설치 후 재시작 첫 실행<br>1.3.7 → 1.3.9로 건너뛴 버전까지 함께 표시</div>
</div>

<!-- ────────── 2) K-Clock 실제 형태 : 신규 설치 유저(최초 실행) ────────── -->
<div class="mock-stage">
  <div class="mock-fakeclock">14:32:07</div>
  <div class="panel open" id="panel-update-fresh">
    <div class="panel-title">업데이트 안내</div>
    <button class="close-panel" onclick="closeUpdateNotice()">✕</button>
    <div class="upd-card" id="upd-card-b"></div>
  </div>
  <div class="mock-caption"><b>신규 설치 유저</b> · 최초 실행<br>같은 컴포넌트, 문구와 표시 범위만 다름</div>
</div>

<!-- ────────── 3) 포팅 미리보기 : 모달 셸(다크) ────────── -->
<div class="mock-stage">
  <div class="mock-win">
    <div class="mock-winbar"><div class="mock-dot3"></div><div class="mock-dot3"></div><div class="mock-dot3"></div></div>
    <div class="mock-winbody">앱 본문 (K-Memo / K-Tube / K-Music / K-Zone)</div>
    <div class="upd-shell--modal open">
      <div class="upd-card" id="upd-card-c">
        <div class="upd-title">업데이트 안내</div>
      </div>
    </div>
  </div>
  <div class="mock-caption">포팅 미리보기 · <b>모달 셸(다크)</b><br>카드 마크업/CSS는 1·2번과 완전히 동일</div>
</div>

<!-- ────────── 4) 포팅 미리보기 : 모달 셸(라이트) ────────── -->
<div class="mock-stage">
  <div class="mock-win light" id="mock-light">
    <div class="mock-winbar"><div class="mock-dot3"></div><div class="mock-dot3"></div><div class="mock-dot3"></div></div>
    <div class="mock-winbody">앱 본문 (라이트 테마)</div>
    <div class="upd-shell--modal open">
      <div class="upd-card" id="upd-card-d">
        <div class="upd-title">업데이트 안내</div>
      </div>
    </div>
  </div>
  <div class="mock-caption">포팅 미리보기 · <b>모달 셸(라이트)</b><br>--upd-* 토큰만 덮어쓴 결과</div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   업데이트 안내 로직 — 이 <script> 블록이 그대로 5개 앱 공용 모듈이 된다.
   외부 의존성 0. localStorage와 DOM만 쓴다.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 앱별 설정(포팅 시 이 4개만 바꾼다) ── */
const UPD_APP       = 'kclock';                                       /* 저장소 키 네임스페이스 */
const UPD_APP_NAME  = 'K-Clock';
const UPD_MORE_URL  = 'https://regina25846-code.github.io/K-clock/';   /* 다운로드/변경내역 페이지 */
const UPD_MAX_VERS  = 3;                                              /* 한 번에 보여줄 최대 버전 수 */

/* ── 외부 링크 열기 훅 (앱별 주입) ──
   '전체 변경 내역'을 어떤 방법으로 열지는 앱마다 다르므로 호스트가 함수를 꽂아준다.
   컴포넌트는 "이 URL을 밖에서 열어줘"라는 의도만 선언하고 수단은 모른다.

   ※ <a target="_blank">에 그냥 맡기면 안 되는 이유(실측):
      - K-Clock(Tauri 2.11.3 + wry 0.55.1): tauri가 new_window_req_handler를 아예 등록하지
        않아서 wry가 None으로 두고, webview2 백엔드가 else 분기에서 args.SetHandled(true)만
        호출하고 끝낸다(wry-0.55.1/src/webview2/mod.rs) → 새 창도 안 열리고 외부 브라우저도
        안 뜨는 '완전한 죽은 링크'. 가능성이 아니라 확정.
      - K-Tube: setWindowOpenHandler가 모든 target=_blank를 유튜브 URL 정규식으로 먼저
        분기시킨다(main.js:199) → 남의 앱 영상재생 로직에 얹혀가는 셈.
      - K-Memo/K-Music: 이미 shell.openExternal / window.api.openExternal 방식을 쓰고 있다
        (kris_music/preload.js:6, renderer/app.js:623) → 훅 방식이 이 집안의 기존 관례와 일치.

   훅을 안 꽂으면(=일반 브라우저에서 이 시안 파일을 열면) 앵커의 기본 동작을 그대로 둔다. */
let UPD_OPEN_EXTERNAL = null;   /* (url:string) => void */

const UPD_KEY_SEEN  = UPD_APP + '.updateNotice.lastSeen';

/* 현재 실행 중인 버전. 실제 앱에서는 이미 있는 APP_VERSION 상수를 그대로 쓴다. */
const APP_VERSION = '1.3.9';

/* ── 변경 내역 데이터 ──
   ※ 네트워크에서 받지 않고 앱 번들에 함께 배포한다.
     이 UI는 "지금 실행 중인 버전"을 설명하는 것이고, update/latest.json의 notes는
     "앞으로 받을 버전"을 설명하는 것이라 대상이 다르다. 또 오프라인에서도 떠야 한다.
   ※ 마크다운 없음. 한 줄 = 항목 하나. */
const UPDATE_NOTES = [
  { version:'1.3.9', date:'2026-08-02', items:[
      '항상 위 고정이 다른 창에 밀려 내려가던 문제를 근본 수정했습니다.',
      '새 버전이 나오면 자동으로 받아서 설치합니다.',
      '알람 소리와 스타일 선택 목록이 시계 창 뒤로 숨지 않도록 바꿨습니다.',
      '윈도우 시스템 알림음을 알람 소리로 고를 수 있습니다.'
  ]},
  { version:'1.3.8', date:'2026-07-28', items:[
      '스타일을 바꿀 때 시계가 패널과 겹치던 현상을 고쳤습니다.',
      '창 크기와 위치를 한 번에 처리해서 전환할 때 떨리지 않습니다.'
  ]},
  { version:'1.3.7', date:'2026-07-19', items:[
      '알람을 수정하고 저장하면 자동으로 다시 켜집니다.',
      '편집 중 엔터를 누르면 바로 저장됩니다.'
  ]}
];

/* ── 버전 비교 ──
   'a > b' 이면 양수. K-앱 테스트빌드 규칙(1.3.9-1 같은 프리릴리즈)을 반영해서
   프리릴리즈가 붙은 쪽을 정식판보다 낮게 본다(semver와 동일). */
function updCmpVersion(a, b){
  const split = v => {
    const [rel, pre] = String(v).split('-');
    return { rel: rel.split('.').map(n => parseInt(n,10) || 0), pre: pre || null };
  };
  const A = split(a), B = split(b);
  for (let i = 0; i < Math.max(A.rel.length, B.rel.length); i++){
    const d = (A.rel[i] || 0) - (B.rel[i] || 0);
    if (d !== 0) return d > 0 ? 1 : -1;
  }
  if (A.pre === B.pre) return 0;
  if (A.pre === null) return 1;      /* 1.3.9 > 1.3.9-1 */
  if (B.pre === null) return -1;
  return A.pre > B.pre ? 1 : -1;
}

/* ── 신규 설치인지 기존 유저인지 판별 ──
   lastSeen 키가 없는 경우가 두 가지라서 그냥 "없으면 신규"로 하면 안 된다.
     (a) 진짜 신규 설치
     (b) 이 기능이 없던 버전(≤1.3.9)을 쓰다가 올라온 기존 유저  ← 파일럿 첫 배포 때 전원이 여기 해당
   기존 앱 데이터가 하나라도 있으면 (b)로 본다. */
const UPD_LEGACY_KEYS = ['alarms','cdPresets','panelColor','panelOpacity'];
function updHasLegacyData(){
  return UPD_LEGACY_KEYS.some(k => localStorage.getItem(k) !== null);
}

/* ── 무엇을 보여줄지 결정 ──
   반환 { mode:'update'|'fresh', notes:[...] } 또는 null(=띄우지 않음) */
function updDecide(){
  let seen = null;
  try { seen = localStorage.getItem(UPD_KEY_SEEN); } catch(e) { return null; }   /* 저장소 자체가 막히면 조용히 미표시 */

  if (seen === null){
    const mode = updHasLegacyData() ? 'update' : 'fresh';
    /* 기준점이 없으므로 최신 버전부터 최대 UPD_MAX_VERS개.
       신규 설치는 굳이 옛날 것까지 볼 이유가 없으니 2개로 더 줄인다. */
    const n = (mode === 'fresh') ? 2 : UPD_MAX_VERS;
    return { mode, notes: UPDATE_NOTES.slice(0, n) };
  }

  if (updCmpVersion(APP_VERSION, seen) <= 0) return null;   /* 이미 봤거나 다운그레이드 → 안 띄움 */

  /* seen 이후로 올라온 버전만. 건너뛴 버전이 여러 개면 전부(최대 UPD_MAX_VERS개) 보여준다. */
  const notes = UPDATE_NOTES
    .filter(n => updCmpVersion(n.version, seen) > 0)
    .slice(0, UPD_MAX_VERS);
  if (!notes.length) return null;                            /* 데이터가 비면 빈 카드 대신 미표시 */
  return { mode:'update', notes };
}

/* ── 렌더 ── */
function updEscape(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function updRender(cardEl, mode, notes){
  /* 두 모드의 차이는 이 한 줄(문구)과 위 updDecide()의 표시 범위뿐이다 — 컴포넌트는 완전 공용 */
  const headline = (mode === 'fresh') ? '최근 변경 내역' : '업데이트가 적용됐습니다';

  const body = notes.map(n => `
      <div class="upd-ver">
        <div class="upd-ver-head">
          <span class="upd-ver-num">${updEscape(n.version)}</span>
          <span class="upd-ver-date">${updEscape(n.date)}</span>
        </div>
        <ul class="upd-list">
          ${n.items.map(t => `<li class="upd-item">${updEscape(t)}</li>`).join('')}
        </ul>
      </div>`).join('');

  /* 모달 셸에서만 쓰는 제목줄은 이미 카드 안에 있으므로 보존한다 */
  const keepTitle = cardEl.querySelector('.upd-title');
  cardEl.innerHTML =
    (keepTitle ? keepTitle.outerHTML : '') + `
    <div class="upd-head">
      <span class="upd-badge">v${updEscape(APP_VERSION)}</span>
      <span class="upd-headline">${updEscape(headline)}</span>
    </div>
    <div class="upd-body">${body}</div>
    <div class="upd-foot">
      <a class="upd-more" href="${updEscape(UPD_MORE_URL)}" target="_blank" rel="noopener">전체 변경 내역</a>
      <button class="upd-ok" onclick="closeUpdateNotice()">확인</button>
    </div>`;

  /* 마크업/CSS는 그대로 두고 동작만 가로챈다 — .upd-more 규칙과 앵커 구조는 손대지 않음 */
  const more = cardEl.querySelector('.upd-more');
  if (more) more.addEventListener('click', updOnMoreClick);
}

function updOnMoreClick(e){
  if (!UPD_OPEN_EXTERNAL) return;   /* 훅 미주입 = 일반 브라우저 → 앵커 기본 동작 유지 */
  e.preventDefault();
  try { UPD_OPEN_EXTERNAL(e.currentTarget.href); } catch(err) {}
}

/* ── 앱별 주입 예시(각 앱에서 딱 한 줄) ──
   K-Clock (Tauri) : UPD_OPEN_EXTERNAL = url => invoke('open_url', { url });
                     ※ Cargo.toml에 opener/shell 플러그인이 없으므로, 기존 open_about/close_app과
                       같은 방식으로 main.rs에 open_url 커맨드 하나를 추가하는 게 가장 일관적이다
                       (플러그인+capability 권한 추가보다 변경면이 작음).
   K-Music         : UPD_OPEN_EXTERNAL = url => window.api.openExternal(url);   // 이미 존재
   K-Memo          : UPD_OPEN_EXTERNAL = url => window.api.openExternal(url);   // shell.openExternal 경로 존재
   K-Tube / K-Zone : preload에 openExternal 노출 후 동일하게 한 줄
   웹/시안          : 주입 안 함 → <a target="_blank"> 기본 동작

   ※ 어느 앱이든 네이티브 쪽에서 https:// 스킴 검증을 할 것.
     K-Music의 main.js:1087이 이미 /^https:\/\//.test(url) 가드를 쓰고 있다. */

/* ── 열기 / 닫기 ──
   실제 K-Clock 구현에서는:
     · 열기  = document.getElementById('panel-update').classList.add('open') 후 syncWindowWidth()
     · 닫기  = 기존 closePanel()을 그대로 호출 (창 크기 복구 로직 재사용)
   "봤음" 기록은 표시 시점이 아니라 닫는 시점에 남긴다 — 띄운 직후 앱이 죽으면
   못 읽고 영영 사라지므로. 닫기 전엔 매 실행마다 다시 뜨는 게 맞다. */
function updMarkSeen(){
  try { localStorage.setItem(UPD_KEY_SEEN, APP_VERSION); } catch(e) {}
}
function isUpdateNoticeOpen(){
  const p = document.getElementById('panel-update');
  return !!(p && p.classList.contains('open'));
}
function closeUpdateNotice(){
  updMarkSeen();
  const p = document.getElementById('panel-update');
  if (p) p.classList.remove('open');
  /* 실제 앱: setTimeout(syncWindowWidth,10); */
}

/* 기존 openPanel/closePanel로 다른 패널이 열리거나 패널이 닫힐 때도 "봤음"으로 친다.
   → 실제 구현은 두 함수 맨 앞에 아래 한 줄씩만 추가한다.
      if (isUpdateNoticeOpen()) updMarkSeen();
   (기존 동작은 건드리지 않는다) */

function initUpdateNotice(){
  const decision = updDecide();
  if (!decision) return;
  const card = document.querySelector('#panel-update .upd-card');
  if (!card) return;
  updRender(card, decision.mode, decision.notes);
  document.getElementById('panel-update').classList.add('open');
  /* 실제 앱: setTimeout(syncWindowWidth,10); */
}

/* ══════════ 아래는 시안 렌더 전용 ══════════ */
/* 4개 스테이지에 각 상태를 강제로 그려서 한 화면에서 비교할 수 있게 함 */
updRender(document.getElementById('upd-card-a'), 'update', UPDATE_NOTES.slice(0,3));
updRender(document.getElementById('upd-card-b'), 'fresh',  UPDATE_NOTES.slice(0,2));
updRender(document.getElementById('upd-card-c'), 'update', UPDATE_NOTES.slice(0,2));
updRender(document.getElementById('upd-card-d'), 'update', UPDATE_NOTES.slice(0,2));
/* 4번 스테이지의 라이트 톤은 .mock-win.light 선택자(위 CSS)가 처리한다 — JS 개입 없음 */
</script>
</body>
