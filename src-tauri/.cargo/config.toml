[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "debuginfo=0", "-C", "strip=symbols"]

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
strip = "symbols"
debug = false
# panic = "abort" 는 뺐다(1.4.5-1, PND-0332 ㉠) — 이게 있으면 main.rs 의 catch_unwind(글자색 자동 화면 읽기)가
# 패닉을 못 잡고 앱이 통째로 꺼진다. 기본값 unwind 로 둔다.
